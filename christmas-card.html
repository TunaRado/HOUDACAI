<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas Jessica!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 20px 10px;
        }
        
        .card {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        
        .card.front {
            background: url('https://images.unsplash.com/photo-1675004743578-fbeeae74e037?q=80&w=622&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') center/cover no-repeat;
        }
        
        .card.back {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        
        .scroll-hint {
            text-align: center;
            color: #ffd700;
            margin: 20px 0;
            font-size: 1.2em;
            animation: bounce 2s ease-in-out infinite;
            padding: 0 20px;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 30px 20px;
        }
        
        .content.split {
            flex-direction: column;
            justify-content: space-around;
            gap: 60px;
        }
        
        .content.right,
        .content.left {
            width: 100%;
            padding: 30px 20px;
        }
        
        .greeting {
            font-size: 2em;
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .name {
            font-size: 2.5em;
            color: #fff;
            text-align: center;
            margin: 15px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            font-style: italic;
        }
        
        .from {
            font-size: 1.3em;
            color: #e8d5c4;
            text-align: center;
            margin-top: 20px;
            font-style: italic;
        }
        
        .back-content {
            text-align: center;
            color: white;
            padding: 40px 30px;
        }
        
        .back-greeting {
            font-size: 2em;
            color: #ffd700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            font-weight: bold;
            line-height: 1.3;
        }
        
        .back-message {
            font-size: 1.5em;
            line-height: 1.8;
            margin: 20px 0;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }
        
        .back-website {
            font-size: 2em;
            color: #ffd700;
            font-weight: bold;
            margin: 25px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }
        
        .back-instructions {
            font-size: 1.4em;
            color: #e0e0e0;
            margin: 15px 0;
        }
        
        .back-good-luck {
            font-size: 1.8em;
            color: #ff6b6b;
            margin: 25px 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }
        
        .back-note {
            font-size: 1.1em;
            color: #b8b8b8;
            margin-top: 25px;
            font-style: italic;
        }
        
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .snowflake {
            position: absolute;
            color: white;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(600px) rotate(360deg); }
        }
        
        .locked-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        
        .locked-screen.active {
            display: flex;
        }
        
        .lock-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        
        .lock-message {
            color: #ffd700;
            font-size: 1.8em;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .countdown {
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .lock-subtitle {
            color: #b8b8b8;
            font-size: 1.2em;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- LOCKED SCREEN -->
    <div class="locked-screen" id="lockedScreen">
        <div class="lock-icon">🎁</div>
        <div class="lock-message">Your Christmas Gift is Locked!</div>
        <div class="countdown" id="countdown">Loading...</div>
        <div class="lock-subtitle">Opens December 25th, 2025 at 9:00 AM</div>
    </div>
    
    <div class="container" id="mainContent">
        <!-- FRONT CARD -->
        <div class="card front">
            <!-- Background SVG decorations -->
            <svg width="100%" height="100%" style="position: absolute; top: 0; left: 0; z-index: 1;" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid slice">
                <!-- Christmas Tree Top -->
                <g transform="translate(250, 150)">
                    <polygon points="0,-60 -40,0 40,0" fill="#2d5c3f" opacity="0.6"/>
                    <polygon points="0,-30 -50,30 50,30" fill="#3a7352" opacity="0.6"/>
                    <polygon points="0,0 -60,60 60,60" fill="#488863" opacity="0.6"/>
                    <rect x="-10" y="60" width="20" height="30" fill="#4a3728" opacity="0.6"/>
                    <!-- Ornaments -->
                    <circle cx="0" cy="-20" r="5" fill="#ffd700"/>
                    <circle cx="-20" cy="10" r="5" fill="#ff0000"/>
                    <circle cx="20" cy="20" r="5" fill="#ffd700"/>
                    <circle cx="-25" cy="45" r="5" fill="#ff0000"/>
                    <circle cx="25" cy="50" r="5" fill="#ffd700"/>
                    <!-- Star on top -->
                    <path d="M0,-70 L3,-58 L16,-58 L6,-50 L9,-38 L0,-46 L-9,-38 L-6,-50 L-16,-58 L-3,-58 Z" fill="#ffd700"/>
                </g>
                
                <!-- Christmas Tree Bottom -->
                <g transform="translate(250, 550)">
                    <polygon points="0,-50 -35,0 35,0" fill="#2d5c3f" opacity="0.6"/>
                    <polygon points="0,-25 -45,25 45,25" fill="#3a7352" opacity="0.6"/>
                    <polygon points="0,0 -50,50 50,50" fill="#488863" opacity="0.6"/>
                    <rect x="-8" y="50" width="16" height="25" fill="#4a3728" opacity="0.6"/>
                    <!-- Ornaments -->
                    <circle cx="0" cy="-15" r="4" fill="#ff0000"/>
                    <circle cx="-18" cy="8" r="4" fill="#ffd700"/>
                    <circle cx="18" cy="15" r="4" fill="#ff0000"/>
                    <circle cx="-22" cy="38" r="4" fill="#ffd700"/>
                    <!-- Star on top -->
                    <path d="M0,-55 L2,-46 L11,-46 L4,-40 L6,-31 L0,-37 L-6,-31 L-4,-40 L-11,-46 L-2,-46 Z" fill="#ffd700"/>
                </g>
                
                <!-- Holly decorations top -->
                <g transform="translate(250, 70)">
                    <ellipse cx="-25" cy="0" rx="12" ry="20" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <ellipse cx="0" cy="-5" rx="12" ry="20" fill="#2d5c3f" opacity="0.7" transform="rotate(20)"/>
                    <ellipse cx="25" cy="0" rx="12" ry="20" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <circle cx="0" cy="10" r="5" fill="#ff0000"/>
                    <circle cx="-8" cy="13" r="4" fill="#ff0000"/>
                    <circle cx="8" cy="13" r="4" fill="#ff0000"/>
                </g>
                
                <!-- Holly decorations middle -->
                <g transform="translate(250, 380)">
                    <ellipse cx="-25" cy="0" rx="12" ry="20" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <ellipse cx="0" cy="-5" rx="12" ry="20" fill="#2d5c3f" opacity="0.7" transform="rotate(20)"/>
                    <ellipse cx="25" cy="0" rx="12" ry="20" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <circle cx="0" cy="10" r="5" fill="#ff0000"/>
                    <circle cx="-8" cy="13" r="4" fill="#ff0000"/>
                    <circle cx="8" cy="13" r="4" fill="#ff0000"/>
                </g>
                
                <!-- Snowflakes as SVG -->
                <g opacity="0.4">
                    <g transform="translate(100, 200)">
                        <line x1="0" y1="-12" x2="0" y2="12" stroke="white" stroke-width="2"/>
                        <line x1="-12" y1="0" x2="12" y2="0" stroke="white" stroke-width="2"/>
                        <line x1="-8" y1="-8" x2="8" y2="8" stroke="white" stroke-width="2"/>
                        <line x1="-8" y1="8" x2="8" y2="-8" stroke="white" stroke-width="2"/>
                    </g>
                    <g transform="translate(400, 300)">
                        <line x1="0" y1="-10" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
                        <line x1="-10" y1="0" x2="10" y2="0" stroke="white" stroke-width="1.5"/>
                        <line x1="-7" y1="-7" x2="7" y2="7" stroke="white" stroke-width="1.5"/>
                        <line x1="-7" y1="7" x2="7" y2="-7" stroke="white" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(80, 600)">
                        <line x1="0" y1="-10" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
                        <line x1="-10" y1="0" x2="10" y2="0" stroke="white" stroke-width="1.5"/>
                        <line x1="-7" y1="-7" x2="7" y2="7" stroke="white" stroke-width="1.5"/>
                        <line x1="-7" y1="7" x2="7" y2="-7" stroke="white" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(420, 700)">
                        <line x1="0" y1="-12" x2="0" y2="12" stroke="white" stroke-width="1.5"/>
                        <line x1="-12" y1="0" x2="12" y2="0" stroke="white" stroke-width="1.5"/>
                        <line x1="-8" y1="-8" x2="8" y2="8" stroke="white" stroke-width="1.5"/>
                        <line x1="-8" y1="8" x2="8" y2="-8" stroke="white" stroke-width="1.5"/>
                    </g>
                </g>
                
                <!-- Decorative border -->
                <rect x="10" y="10" width="480" height="780" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" rx="5"/>
                <rect x="15" y="15" width="470" height="770" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3" rx="5"/>
            </svg>
            
            <!-- Content -->
            <div class="content split">
                <div class="content left">
                    <div class="greeting">Merry Christmas</div>
                    <div style="font-size: 1.5em; color: #ffd700; margin: 15px 0;">🎄 ✨ 🎁 ✨ 🎄</div>
                    <div class="from">2025</div>
                </div>
                
                <div class="content right">
                    <div class="greeting">Merry Christmas</div>
                    <div class="name">Jessica</div>
                    <div style="font-size: 1.5em; color: #ffd700; margin: 15px 0;">❄ ✨ 🎄 ✨ ❄</div>
                    <div class="from">From Brandon</div>
                </div>
            </div>
            
            <!-- Sparkles -->
            <div class="sparkle" style="top: 15%; left: 60%; animation-delay: 0s;"></div>
            <div class="sparkle" style="top: 25%; left: 90%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="top: 45%; left: 58%; animation-delay: 1s;"></div>
            <div class="sparkle" style="top: 65%; left: 92%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 80%; left: 65%; animation-delay: 2s;"></div>
            <div class="sparkle" style="top: 30%; left: 85%; animation-delay: 2.5s;"></div>
        </div>
        
        <!-- SCROLL HINT -->
        <div class="scroll-hint">
            ↓ Scroll Down for Your Gift! ↓
        </div>
        
        <!-- BACK CARD -->
        <div class="card back">
            <div class="back-content">
                <div class="back-greeting">🎄 Merry Christmas Jessica! 🎄</div>
                
                <div class="back-message">Go to</div>
                <div class="back-website">Houdacai.com</div>
                <div class="back-instructions">and click <strong style="color: #ffd700;">FishSaber!</strong></div>
                
                <div class="back-good-luck">Good Luck! 🎁</div>
                
                <div class="back-note">Desktop PC recommended</div>
            </div>
            
            <!-- Decorative sparkles -->
            <div class="sparkle" style="top: 10%; left: 15%; animation-delay: 0s;"></div>
            <div class="sparkle" style="top: 20%; left: 85%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="top: 40%; left: 10%; animation-delay: 1s;"></div>
            <div class="sparkle" style="top: 60%; left: 90%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 80%; left: 20%; animation-delay: 2s;"></div>
            <div class="sparkle" style="top: 85%; left: 80%; animation-delay: 2.5s;"></div>
        </div>
    </div>
    
    <script>
        // Set the unlock date and time: December 25, 2025 at 9:00 AM
        const unlockDate = new Date('2025-12-25T09:00:00');
        
        function checkAccess() {
            const now = new Date();
            
            if (now >= unlockDate) {
                // Time has passed, show the card
                document.getElementById('lockedScreen').classList.remove('active');
                document.getElementById('mainContent').style.display = 'flex';
            } else {
                // Still locked, show countdown
                document.getElementById('lockedScreen').classList.add('active');
                document.getElementById('mainContent').style.display = 'none';
                updateCountdown();
            }
        }
        
        function updateCountdown() {
            const now = new Date();
            const timeLeft = unlockDate - now;
            
            if (timeLeft <= 0) {
                checkAccess();
                return;
            }
            
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
            
            const countdownText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            document.getElementById('countdown').textContent = countdownText;
            
            setTimeout(updateCountdown, 1000);
        }
        
        // Check access on page load
        checkAccess();
    </script>
</body>
</html>
