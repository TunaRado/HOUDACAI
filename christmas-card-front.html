<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Card for Jessica - Front</title>
    <style>
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none;
            }
        }
        
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }
        
        .card {
            width: 8.5in;
            height: 5.5in;
            background: url('https://images.unsplash.com/photo-1675004743578-fbeeae74e037?q=80&w=622&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') center/cover no-repeat;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        
        .print-note {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }
        
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .content.right {
            width: 50%;
            margin-left: auto;
        }
        
        .content.left {
            width: 50%;
            position: absolute;
            left: 0;
            top: 0;
        }
        
        .greeting {
            font-size: 3em;
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .name {
            font-size: 4em;
            color: #fff;
            text-align: center;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            font-style: italic;
        }
        
        .from {
            font-size: 1.8em;
            color: #e8d5c4;
            text-align: center;
            margin-top: 30px;
            font-style: italic;
        }
        
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .snowflake {
            position: absolute;
            color: white;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(600px) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="card">
            <!-- Background SVG decorations -->
            <svg width="100%" height="100%" style="position: absolute; top: 0; left: 0; z-index: 1;">
                <!-- Christmas Tree Left -->
                <g transform="translate(550, 150)">
                    <polygon points="50,0 0,80 100,80" fill="#2d5c3f" opacity="0.6"/>
                    <polygon points="50,40 10,110 90,110" fill="#3a7352" opacity="0.6"/>
                    <polygon points="50,80 20,140 80,140" fill="#488863" opacity="0.6"/>
                    <rect x="40" y="140" width="20" height="30" fill="#4a3728" opacity="0.6"/>
                    <!-- Ornaments -->
                    <circle cx="50" cy="50" r="5" fill="#ffd700"/>
                    <circle cx="35" cy="90" r="5" fill="#ff0000"/>
                    <circle cx="65" cy="100" r="5" fill="#ffd700"/>
                    <circle cx="30" cy="120" r="5" fill="#ff0000"/>
                    <circle cx="70" cy="130" r="5" fill="#ffd700"/>
                    <!-- Star on top -->
                    <path d="M50,0 L54,12 L67,12 L56,20 L60,32 L50,24 L40,32 L44,20 L33,12 L46,12 Z" fill="#ffd700" transform="translate(0,-10)"/>
                </g>
                
                <!-- Christmas Tree Right -->
                <g transform="translate(680, 280)">
                    <polygon points="40,0 0,60 80,60" fill="#2d5c3f" opacity="0.6"/>
                    <polygon points="40,30 8,85 72,85" fill="#3a7352" opacity="0.6"/>
                    <polygon points="40,60 15,110 65,110" fill="#488863" opacity="0.6"/>
                    <rect x="32" y="110" width="16" height="25" fill="#4a3728" opacity="0.6"/>
                    <!-- Ornaments -->
                    <circle cx="40" cy="40" r="4" fill="#ff0000"/>
                    <circle cx="28" cy="70" r="4" fill="#ffd700"/>
                    <circle cx="52" cy="75" r="4" fill="#ff0000"/>
                    <circle cx="25" cy="95" r="4" fill="#ffd700"/>
                    <!-- Star on top -->
                    <path d="M40,0 L43,9 L53,9 L45,15 L48,24 L40,18 L32,24 L35,15 L27,9 L37,9 Z" fill="#ffd700" transform="translate(0,-8)"/>
                </g>
                
                <!-- Holly decorations top -->
                <g transform="translate(550, 50)">
                    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <ellipse cx="25" cy="-5" rx="15" ry="25" fill="#2d5c3f" opacity="0.7" transform="rotate(20)"/>
                    <ellipse cx="50" cy="0" rx="15" ry="25" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <circle cx="25" cy="10" r="6" fill="#ff0000"/>
                    <circle cx="18" cy="15" r="5" fill="#ff0000"/>
                    <circle cx="32" cy="15" r="5" fill="#ff0000"/>
                </g>
                
                <!-- Holly decorations bottom -->
                <g transform="translate(560, 320)">
                    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <ellipse cx="25" cy="-5" rx="15" ry="25" fill="#2d5c3f" opacity="0.7" transform="rotate(20)"/>
                    <ellipse cx="50" cy="0" rx="15" ry="25" fill="#2d5c3f" opacity="0.7" transform="rotate(-20)"/>
                    <circle cx="25" cy="10" r="6" fill="#ff0000"/>
                    <circle cx="18" cy="15" r="5" fill="#ff0000"/>
                    <circle cx="32" cy="15" r="5" fill="#ff0000"/>
                </g>
                
                <!-- Snowflakes as SVG -->
                <g opacity="0.4">
                    <g transform="translate(500, 100)">
                        <line x1="0" y1="-15" x2="0" y2="15" stroke="white" stroke-width="2"/>
                        <line x1="-15" y1="0" x2="15" y2="0" stroke="white" stroke-width="2"/>
                        <line x1="-10" y1="-10" x2="10" y2="10" stroke="white" stroke-width="2"/>
                        <line x1="-10" y1="10" x2="10" y2="-10" stroke="white" stroke-width="2"/>
                    </g>
                    <g transform="translate(700, 180)">
                        <line x1="0" y1="-12" x2="0" y2="12" stroke="white" stroke-width="1.5"/>
                        <line x1="-12" y1="0" x2="12" y2="0" stroke="white" stroke-width="1.5"/>
                        <line x1="-8" y1="-8" x2="8" y2="8" stroke="white" stroke-width="1.5"/>
                        <line x1="-8" y1="8" x2="8" y2="-8" stroke="white" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(480, 280)">
                        <line x1="0" y1="-10" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
                        <line x1="-10" y1="0" x2="10" y2="0" stroke="white" stroke-width="1.5"/>
                        <line x1="-7" y1="-7" x2="7" y2="7" stroke="white" stroke-width="1.5"/>
                        <line x1="-7" y1="7" x2="7" y2="-7" stroke="white" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(730, 340)">
                        <line x1="0" y1="-12" x2="0" y2="12" stroke="white" stroke-width="1.5"/>
                        <line x1="-12" y1="0" x2="12" y2="0" stroke="white" stroke-width="1.5"/>
                        <line x1="-8" y1="-8" x2="8" y2="8" stroke="white" stroke-width="1.5"/>
                        <line x1="-8" y1="8" x2="8" y2="-8" stroke="white" stroke-width="1.5"/>
                    </g>
                </g>
                
                <!-- Decorative border -->
                <rect x="20" y="20" width="776" height="356" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.4" rx="5"/>
                <rect x="25" y="25" width="766" height="346" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3" rx="5"/>
            </svg>
            
            <!-- Content Left -->
            <div class="content left">
                <div class="greeting">Merry Christmas</div>
                <div style="font-size: 2em; color: #ffd700; margin: 20px 0;">🎄 ✨ 🎁 ✨ 🎄</div>
                <div class="from">2025</div>
            </div>
            
            <!-- Content Right -->
            <div class="content right">
                <div class="greeting">Merry Christmas</div>
                <div class="name">Jessica</div>
                <div style="font-size: 2em; color: #ffd700; margin: 20px 0;">❄ ✨ 🎄 ✨ ❄</div>
                <div class="from">From Brandon</div>
            </div>
            
            <!-- Sparkles -->
            <div class="sparkle" style="top: 15%; left: 60%; animation-delay: 0s;"></div>
            <div class="sparkle" style="top: 25%; left: 90%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="top: 45%; left: 58%; animation-delay: 1s;"></div>
            <div class="sparkle" style="top: 65%; left: 92%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 80%; left: 65%; animation-delay: 2s;"></div>
            <div class="sparkle" style="top: 30%; left: 85%; animation-delay: 2.5s;"></div>
        </div>
        
        <p class="print-note no-print">Press Ctrl+P to print the FRONT side • Recommended: Landscape orientation</p>
    </div>
</body>
</html>
